<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aquilux — Product Detail Engine</title>
<style>
/* ==========================================================================
   iOS 27 Liquid Glass Aesthetic & SF Typography System
   ========================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=SF+Pro+Display:wght@300;400;500;600;700&family=Inter:wght@200;300;400;500;600&display=swap');

:root {
  --bg: #f2f2f7;
  --surface: rgba(255, 255, 255, 0.65);
  --surface-solid: #ffffff;
  --text: #000000;
  --text-secondary: #6e6e73;
  --line: rgba(0, 0, 0, 0.08);
  --liquid-border: rgba(255, 255, 255, 0.8);
  --radius-ios: 28px;
  --radius-pill: 999px;
  --shadow-liquid: 0 16px 40px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  --spring-ios: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --ease-ios: cubic-bezier(0.16, 1, 0.3, 1);
}

html[data-theme="dark"] {
  --bg: #000000;
  --surface: rgba(28, 28, 30, 0.65);
  --surface-solid: #1c1c1e;
  --text: #ffffff;
  --text-secondary: #98989d;
  --line: rgba(255, 255, 255, 0.12);
  --liquid-border: rgba(255, 255, 255, 0.15);
  --shadow-liquid: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  padding-top: 110px;
  min-height: 100vh;
}

/* Liquid Glass Floating Header */
header {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 1320px;
  padding: 14px 28px; display: flex; justify-content: space-between; align-items: center;
  background: var(--surface);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid var(--liquid-border); border-radius: var(--radius-pill);
  box-shadow: var(--shadow-liquid); z-index: 100; transition: all 0.3s var(--ease-ios);
}

.logo-box {
  font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600;
  cursor: pointer; text-decoration: none; color: inherit; letter-spacing: 1.5px; text-transform: uppercase;
}

/* Main Container Layout */
.product-container {
  display: flex;
  max-width: 1140px;
  margin: 20px auto 60px auto;
  padding: 32px 4%;
  gap: 56px;
  align-items: center;
  background: var(--surface);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid var(--liquid-border);
  border-radius: var(--radius-ios);
  box-shadow: var(--shadow-liquid);
  visibility: hidden;
  opacity: 0;
  transition: opacity 0.5s var(--ease-ios), transform 0.5s var(--ease-ios);
}

.product-media { flex: 1.1; position: relative; width: 100%; }
.product-info-panel { flex: 1; display: flex; flex-direction: column; justify-content: center; }

.main-display-image {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  background: var(--surface-solid);
  border-radius: 20px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.06);
  transition: filter 0.5s var(--ease-ios);
}
.main-display-image.blurred {
  filter: blur(30px) brightness(0.9);
  pointer-events: none;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.8rem;
  font-weight: 400;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
  line-height: 1.1;
}

.price-tag {
  font-size: 1.3rem;
  font-weight: 500;
  margin-bottom: 32px;
  color: var(--text-secondary);
}

.selector-wrapper { margin-bottom: 28px; }
.selector-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  display: block;
  font-weight: 700;
}

/* Size Capsules */
.size-capsule-tray { display: flex; gap: 10px; flex-wrap: wrap; }
.size-node-btn {
  padding: 12px 22px; font-size: 12px; font-weight: 600; background: var(--surface-solid);
  border: 1px solid var(--line); border-radius: var(--radius-pill); color: var(--text); cursor: pointer;
  transition: all 0.3s var(--spring-ios);
}
.size-node-btn:hover { transform: scale(1.05); }
.size-node-btn.selected { background: var(--text); color: var(--bg); border-color: var(--text); }

/* Quantity Controls */
.qty-control-dock {
  display: inline-flex; align-items: center; border: 1px solid var(--line);
  border-radius: var(--radius-pill); overflow: hidden; margin-bottom: 32px; background: var(--surface-solid);
}
.qty-control-dock button {
  padding: 10px 20px; font-size: 16px; background: transparent; border: none;
  cursor: pointer; color: var(--text); transition: background 0.2s;
}
.qty-control-dock button:hover { background: var(--line); }
.qty-control-dock span { padding: 0 12px; font-size: 13px; font-weight: 600; min-width: 36px; text-align: center; user-select: none; }

/* Dual Action Button Architecture */
.button-action-stack { display: flex; flex-direction: column; gap: 12px; width: 100%; }

.action-btn {
  width: 100%;
  padding: 18px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s var(--spring-ios);
  border-radius: var(--radius-pill);
}

.bag-btn {
  background: var(--surface-solid);
  color: var(--text);
  border: 1px solid var(--line);
}
.bag-btn:hover { transform: scale(1.02); border-color: var(--text); }

.buy-now-btn { 
  background: var(--text); 
  color: var(--bg); 
  border: 1px solid var(--text); 
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.buy-now-btn:hover { transform: scale(1.02); opacity: 0.95; }

.payment-vectors-dock { display: inline-flex; align-items: center; gap: 8px; }
.payment-vector-icon {
  height: 14px;
  width: auto;
  object-fit: contain;
  filter: brightness(0) invert(1);
  opacity: 0.9;
}

/* Countdown Dock */
.page-countdown-dock {
  margin-top: 24px; border: 1px dashed var(--line); padding: 24px;
  background: var(--surface-solid); border-radius: 20px; text-align: center; display: none;
}
.countdown-grid { display: flex; justify-content: center; gap: 12px; margin-top: 14px; }
.countdown-box {
  background: var(--text); color: var(--bg); padding: 12px 16px; min-width: 65px;
  text-align: center; font-weight: 600; border-radius: 12px; font-size: 15px;
}
.countdown-box span { display: block; font-size: 8px; opacity: 0.6; font-weight: 500; text-transform: uppercase; margin-top: 2px; }

/* iOS Loader System */
#pageMenuLoader { 
  position: fixed; inset: 0; background: var(--bg); display: flex; 
  justify-content: center; align-items: center; flex-direction: column; gap: 18px; 
  z-index: 999999; opacity: 1; transition: opacity 0.4s var(--ease-ios); 
}
#pageMenuLoader.hide { opacity: 0; pointer-events: none; }
#pageMenuLoader img { width: 55px; animation: luxSpin 1.6s var(--spring-ios) infinite; }
@keyframes luxSpin { 
  0% { transform: scale(0.92); opacity: 0.5; } 
  50% { transform: scale(1.05); opacity: 1; } 
  100% { transform: scale(0.92); opacity: 0.5; } 
}

@media (max-width: 768px) {
  body { padding-top: 95px; }
  header { width: 94%; top: 12px; padding: 12px 20px; }
  .product-container { flex-direction: column; gap: 32px; padding: 24px; margin: 10px auto 40px auto; border-radius: 24px; }
  h1 { font-size: 2.2rem; }
}
</style>
</head>
<body>

<!-- PREMIUM SYSTEM WELCOME LOADER -->
<div id="pageMenuLoader">
 <img src="https://i.ibb.co/KcK5JqBf/IMG-0068.png" alt="Aquilux Logo">
 <p style="font-size: 12px; letter-spacing: 2px; font-weight: 500; opacity: 0.7; text-transform: uppercase;">Loading..</p>
</div>

<header>
 <a href="index.html" class="logo-box">Aquilux</a>
</header>

<div class="product-container" id="mainProductWrapper">
    <div class="product-media">
        <img id="productImage" class="main-display-image" src="" alt="Aquilux Product Asset">
    </div>
    
    <div class="product-info-panel">
        <h1 id="productTitle"></h1>
        <div class="price-tag" id="productPrice"></div>
        
        <!-- Highly Functional Controls Dock Area -->
        <div id="interactivePurchaseControls">
            <div class="selector-wrapper">
                <span class="selector-label">Choose Size</span>
                <div class="size-capsule-tray" id="sizeCapsuleTrayContainer"></div>
            </div>

            <div class="selector-wrapper" style="margin-bottom: 20px;">
                <span class="selector-label">Quantity</span>
                <div class="qty-control-dock">
                    <button onclick="changePageQuantity(-1)">−</button>
                    <span id="pageQuantityDisplay">1</span>
                    <button onclick="changePageQuantity(1)">+</button>
                </div>
            </div>

            <!-- Premium Dual Action Stack Layout -->
            <div class="button-action-stack">
                <button class="action-btn buy-now-btn" id="buyNowBtn" onclick="handleInstantBuyNow()">
                    <span>Buy It Now</span>
                    <div class="payment-vectors-dock">
                        <img class="payment-vector-icon" src="images/gpay.svg" alt="Google Pay">
                        <img class="payment-vector-icon" src="images/PhonePe_Logo.svg" alt="PhonePe">
                        <img class="payment-vector-icon" src="images/Bhim.svg" alt="BHIM">
                    </div>
                </button>
                <button class="action-btn bag-btn" id="addToBagBtn" onclick="handlePageAddToCart()">Add To Bag</button>
            </div>
        </div>

        <!-- Dynamic Hype Clock Engine Container -->
        <div class="page-countdown-dock" id="pageCountdownModule">
            <span class="selector-label" style="opacity:0.9; font-weight:700;">Exclusive Drop Reveals In</span>
            <div class="countdown-grid" id="pageClockGrid"></div>
        </div>
    </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyihaeB4hLfxAL-9XdQDlRfDjg1oWcuiy0JlhiapCI9MGckg3eWGGqBXWNhubsaF2A/exec";
let targetProduct = null;
let chosenSize = "";
let selectedQty = 1;

async function initProductPage() {
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    
    if(!productId) { window.location.href = "index.html"; return; }

    try {
        const res = await fetch(API_URL + "?t=" + new Date().getTime());
        const products = await res.json();
        
        targetProduct = products.find((p, i) => String(p.id || p.ID || i) === String(productId));

        if(!targetProduct) { 
            document.getElementById("productTitle").innerText = "Product Not Found"; 
            hideLoaderAndShowContent();
            return; 
        }

        document.getElementById("productTitle").innerText = targetProduct.product;
        document.getElementById("productPrice").innerText = "₹" + targetProduct.price;
        const imgNode = document.getElementById("productImage");
        imgNode.src = targetProduct.image;

        // Render dynamic premium size capsule nodes
        const sizes = targetProduct.sizes?.length > 0 ? targetProduct.sizes : ['S', 'M', 'L', 'XL'];
        const tray = document.getElementById("sizeCapsuleTrayContainer");
        tray.innerHTML = "";
        
        sizes.forEach((s, idx) => {
            const btn = document.createElement("button");
            btn.className = `size-node-btn ${idx === 0 ? 'selected' : ''}`;
            btn.innerText = s;
            if(idx === 0) chosenSize = s; 
            btn.onclick = () => {
                document.querySelectorAll(".size-node-btn").forEach(b => b.classList.remove("selected"));
                btn.classList.add("selected");
                chosenSize = s;
            };
            tray.appendChild(btn);
        });

        // Time constraints validation logic
        let rawLaunch = targetProduct.launchDate || targetProduct.launchdate || null;
        let launchTimestamp = null;
        if (rawLaunch) {
            let cleanStr = String(rawLaunch).trim().replace(/\//g, '-');
            if(!cleanStr.includes('T') && cleanStr.includes(' ')) cleanStr = cleanStr.replace(' ', 'T');
            launchTimestamp = Date.parse(cleanStr);
        }

        const nowTime = new Date().getTime();
        if(launchTimestamp && launchTimestamp > nowTime) {
            imgNode.classList.add("blurred");
            document.getElementById("interactivePurchaseControls").style.display = "none";
            document.getElementById("pageCountdownModule").style.display = "block";
            startPageTimerLoop(launchTimestamp);
        }

        if(imgNode.complete) {
            hideLoaderAndShowContent();
        } else {
            imgNode.onload = function() {
                hideLoaderAndShowContent();
            };
        }

    } catch (e) { 
        document.getElementById("productTitle").innerText = "Error Syncing Parameters"; 
        hideLoaderAndShowContent();
    }
}

function hideLoaderAndShowContent() {
    const loader = document.getElementById("pageMenuLoader");
    const container = document.getElementById("mainProductWrapper");
    
    loader.classList.add("hide");
    container.style.visibility = "visible";
    container.style.opacity = "1";
}

function changePageQuantity(amount) {
    selectedQty += amount;
    if(selectedQty < 1) selectedQty = 1;
    document.getElementById("pageQuantityDisplay").innerText = selectedQty;
}

function startPageTimerLoop(targetTime) {
    const loop = setInterval(() => {
        const now = new Date().getTime();
        const diff = targetTime - now;

        if(diff <= 0) {
            clearInterval(loop);
            document.getElementById("productImage").classList.remove("blurred");
            document.getElementById("interactivePurchaseControls").style.display = "block";
            document.getElementById("pageCountdownModule").style.display = "none";
            return;
        }

        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById("pageClockGrid").innerHTML = `
            <div class="countdown-box">${d}<span>Days</span></div>
            <div class="countdown-box">${String(h).padStart(2, '0')}<span>Hrs</span></div>
            <div class="countdown-box">${String(m).padStart(2, '0')}<span>Min</span></div>
            <div class="countdown-box">${String(s).padStart(2, '0')}<span>Sec</span></div>
        `;
    }, 1000);
}

function handlePageAddToCart() {
    if(!targetProduct) return;
    let localCart = JSON.parse(localStorage.getItem("aquilux_cart") || "[]");

    let existingItem = localCart.find(x => x.n === targetProduct.product && x.s === chosenSize);
    if(existingItem) {
        existingItem.q += selectedQty;
    } else {
        localCart.push({
            n: targetProduct.product,
            p: Number(targetProduct.price),
            s: chosenSize,
            q: selectedQty,
            img: targetProduct.image
        });
    }

    localStorage.setItem("aquilux_cart", JSON.stringify(localCart));
    alert(`${selectedQty} Item(s) successfully secured inside Shopping Bag!`);
    window.location.href = "index.html"; 
}

function handleInstantBuyNow() {
    if(!targetProduct) return;
    
    const savedAddr = JSON.parse(localStorage.getItem("aquilux_saved_address") || "{}");
    if(!savedAddr.receiverName || !savedAddr.phone || !savedAddr.pincode) {
        alert("Please setup your Shipping Address parameters inside Account Space first!");
        window.location.href = "index.html"; 
        return;
    }

    const singleProductCartPayload = [{
        n: targetProduct.product,
        p: Number(targetProduct.price),
        s: chosenSize,
        q: selectedQty,
        img: targetProduct.image
    }];

    const orderData = {
        cart: singleProductCartPayload,
        total: Number(targetProduct.price) * selectedQty,
        receiverName: savedAddr.receiverName,
        phone: savedAddr.phone,
        flat: savedAddr.flat || "",
        road: savedAddr.road || "",
        landmark: savedAddr.landmark || "", 
        city: savedAddr.city || "",
        state: savedAddr.state || "",
        pincode: savedAddr.pincode
    };

    localStorage.setItem("pendingOrder", JSON.stringify(orderData));
    window.location.href = "payment-gateway.html";
}

window.addEventListener("DOMContentLoaded", initProductPage);
</script>
</body>
</html>
